<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi equipo - Fantasy Premier League</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #37003c; color: white; }
    </style>
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>

<h1 th:text="${equipo.nombreDelEquipo}"></h1>

<p th:if="${exito}" th:text="${exito}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<p>
    Puntos totales: <strong th:text="${puntosTotales}"></strong> |
    Presupuesto restante: <strong th:text="${presupuestoRestante}"></strong>
    de <span th:text="${presupuestoTotal}"></span> |
    Jugadores: <strong th:text="${#lists.size(jugadoresDelEquipo)}"></strong> / 15
</p>

<table>
    <thead>
    <tr>
        <th>Jugador</th>
        <th>Equipo real</th>
        <th>Posición</th>
        <th>Precio</th>
        <th>Puntos</th>
        <th>Acción</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ej : ${jugadoresDelEquipo}">
        <td th:text="${ej.jugador.nombre}"></td>
        <td th:text="${ej.jugador.equipo}"></td>
        <td th:text="${ej.jugador.posicion}"></td>
        <td th:text="${ej.jugador.precio}"></td>
        <td th:text="${ej.puntosObtenidos}"></td>
        <td>
            <form th:action="@{/vender}" method="post">
                <input type="hidden" name="jugadorId" th:value="${ej.jugador.id}">
                <button type="submit">Vender</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>>
