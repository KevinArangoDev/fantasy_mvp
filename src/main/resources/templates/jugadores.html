<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jugadores - Fantasy Premier League</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #37003c; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Jugadores disponibles</h1>
<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Equipo</th>
        <th>Posición</th>
        <th>Precio</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="jugador : ${jugadores}">
        <td th:text="${jugador.nombre}"></td>
        <td th:text="${jugador.equipo}"></td>
        <td th:text="${jugador.posicion}"></td>
        <td th:text="${jugador.precio}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
