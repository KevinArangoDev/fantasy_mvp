<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="menu" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/jugadores}"><span class="brand-mark"></span>Fantasy PL</a>

        <nav class="nav-links">
            <a th:href="@{/jugadores}">Jugadores</a>
            <a th:href="@{/ranking}">Ranking</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/app}">Panel</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/mi-equipo}">Mi equipo</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/puntos}">Admin</a>
        </nav>

        <div class="nav-right">
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-ghost btn-sm">Cerrar sesión</button>
            </form>
            <a sec:authorize="!isAuthenticated()" class="btn btn-ghost btn-sm" th:href="@{/login}">Entrar</a>
            <a sec:authorize="!isAuthenticated()" class="btn btn-primary btn-sm" th:href="@{/registro}">Crear cuenta</a>
        </div>
    </div>
</header>

<span th:fragment="posicion(pos)" class="badge"
      th:classappend="${pos == 'Portero'} ? 'badge-por' : (${pos == 'Defensa'} ? 'badge-def' : (${pos == 'Mediocampista'} ? 'badge-med' : 'badge-del'))"
      th:text="${pos}"></span>

</body>
</html>
