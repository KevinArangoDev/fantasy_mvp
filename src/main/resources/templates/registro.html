<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · Fantasy Premier League</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>

<main class="container">
    <div class="auth card">
        <h1>Crear cuenta</h1>
        <p class="muted">Proyecto de demostración: usa datos de prueba.</p>

        <form th:action="@{/registro}" th:object="${registroForm}" method="post">
            <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}">
                <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="text" th:field="*{email}">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="password">Contraseña (mínimo 8 caracteres)</label>
                <input id="password" type="password" th:field="*{password}">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Crear cuenta</button>
        </form>

        <p class="auth-alt">¿Ya tienes cuenta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</main>
</body>
</html>
