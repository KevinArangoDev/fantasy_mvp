<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Fantasy Premier League</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 400px; }
        input { display: block; width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { background-color: #37003c; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h1>Crear cuenta</h1>
<form th:action="@{/registro}" th:object="${registroForm}" method="post">
    <label>Nombre</label>
    <input type="text" th:field="*{nombre}">
    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: red;"></p>

    <label>Email</label>
    <input type="text" th:field="*{email}">
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></p>

    <label>Contraseña (mínimo 8 caracteres)</label>
    <input type="password" th:field="*{password}">
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></p>

    <button type="submit">Registrarme</button>
</form>
</body>
</html>
