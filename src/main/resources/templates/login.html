<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Fantasy Premier League</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 400px; }
        input { display: block; width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { background-color: #37003c; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h1>Iniciar sesión</h1>
<form th:action="@{/login}" method="post">
    <label>Email</label>
    <input type="email" name="email" required>

    <label>Contraseña</label>
    <input type="password" name="password" required>

    <button type="submit">Entrar</button>
</form>
</body>
</html>
