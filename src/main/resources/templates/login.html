<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Fantasy Premier League</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragmentos :: menu}"></div>

<main class="container">
    <div class="auth card">
        <h1>Entrar</h1>
        <p class="muted">Accede a tu equipo.</p>

        <p th:if="${param.error}" class="msg msg-error">Email o contraseña incorrectos.</p>
        <p th:if="${param.logout}" class="msg msg-ok">Cerraste sesión.</p>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
        </form>

        <p class="auth-alt">¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
    </div>
</main>
</body>
</html>
